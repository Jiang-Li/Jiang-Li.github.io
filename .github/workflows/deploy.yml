name: Deploy Site
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
id-token: <redacted>

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Build the Astro site (includes pagefind search index)
    - name: Build site
      run: |
        echo "🌐 Building Astro website..."
        npm run build
        echo "✅ Site built successfully"
        echo "📊 Verifying key pages exist:"
        for page in index.html course.html teach/ai-workflow/index.html; do
          if [ -f "dist/$page" ]; then
            echo "  ✅ $page ($(du -h dist/$page | cut -f1))"
          else
            echo "  ❌ $page MISSING" && exit 1
          fi
        done

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload site
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Report deployment success
      run: |
        echo "🎉 Site deployed successfully!"
        echo "🌐 Website deployed to: ${{ steps.deployment.outputs.page_url }}"
